name: validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Must be built with a Go >= the `go` directive in go.mod, or it
          # refuses to start ("the Go language version used to build
          # golangci-lint is lower than the targeted Go version"). v2.1.6
          # targeted go1.23 and broke as soon as a dependency bump moved
          # go.mod to 1.25.0. Dependabot does NOT track this input — only the
          # action version above — so raise it by hand when go.mod moves.
          version: v2.12.2
          args: --timeout 5m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go build & test
        run: |
          go build ./...
          go test ./...

      - name: Notify Telegram on failure
        if: failure()
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ *mctl-agent validate failed*
            Branch: `${{ github.ref_name }}`
            Commit: `${{ github.sha }}`
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
