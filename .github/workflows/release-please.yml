name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # release-please has to open the release PR as somebody. The default
      # GITHUB_TOKEN cannot: "Allow GitHub Actions to create and approve pull
      # requests" is off at the org level, and on mctl-telegram every push to
      # main after 0.59.0 failed with "GitHub Actions is not permitted to
      # create or approve pull requests" until mctl-telegram#498 -- seven
      # releases' worth of commits with no release PR and nothing deployed.
      # Nothing has broken here yet only because there have been no
      # user-facing commits since the last release; the first one would hit
      # the same wall. Minting a token from the mctl-agents App (contents +
      # pull-requests write on every mctlhq repo) sidesteps the setting
      # without turning it back on, and a PR opened with an App token also
      # raises pull_request events, so the release PR gets normal CI instead
      # of the default token's silent one.
      - name: Generate release token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-agent
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Split from release-please so the dispatch key is only visible to this job
  # (#1033). Runs on push to main only, which the main-only `app-dispatch`
  # environment requires. !cancelled() so a late failure in the release step
  # cannot skip the dispatch of a tag that was already created; the outputs
  # of the release step survive that failure.
  dispatch:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Main-only; holds DISPATCH_APP_PRIVATE_KEY (#1033).
    environment: app-dispatch
    permissions: {}
    steps:
      # Uses mctl-gitops-dispatch, an App that can only dispatch workflows
      # (actions:write + metadata:read) and is installed on mctl-gitops alone
      # (mctlhq/mctl-gitops#1033). Its key lives in the main-only `app-dispatch`
      # environment, so a run from any other branch cannot mint a token.
      - name: Generate Platform App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops
          permission-actions: write

      - name: Dispatch centralized release-deploy
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh workflow run release-deploy.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f repo=mctlhq/mctl-agent \
            -f git_ref="$TAG" \
            -f image_name=ghcr.io/mctlhq/mctl-agent \
            -f image_tag="$TAG" \
            -f team_name=admins \
            -f component_name=mctl-agent \
            -f values_path=platform-gitops/bootstrap/templates/mctl-platform/mctl-agent.yaml

  notify:
    needs: [release-please, dispatch]
    if: ${{ always() && needs.release-please.outputs.release_created == 'true' && contains(fromJSON('["failure", "skipped"]'), needs.dispatch.result) }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify Telegram on release/deploy failure
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ *mctl-agent release-deploy dispatch failed*
            Tag `${{ needs.release-please.outputs.tag_name }}` was created but the centralized deploy did not dispatch.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
