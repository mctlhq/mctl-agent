name: security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # setup-go v7 pins GOTOOLCHAIN=local, so `go install ...@<version>` can
      # no longer pull a newer toolchain than the `go` directive in go.mod —
      # x/vuln v1.7.0 requires >= 1.25.0 and the install step hard-fails.
      # (The scan step below is fail-closed; this one is not.)
      # Pinned to v1.7.0 (not @latest) for reproducibility now that the scan
      # step is fail-closed. The vulnerability DB itself still floats since
      # govulncheck fetches it at runtime — only the tool version is pinned.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
        env:
          GOTOOLCHAIN: auto
      - name: govulncheck
        # Fail-closed as of the Go 1.26.6 bump: the stdlib findings that
        # previously required continue-on-error are resolved by the
        # toolchain bump. Trivy remains fail-closed on unfixed CRITICAL.
        run: govulncheck ./...

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.69.3
