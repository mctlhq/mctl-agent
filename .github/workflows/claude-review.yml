name: Claude PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude-review:
    uses: mctlhq/.github/.github/workflows/claude-review.yml@50b66e3b15cd186f3b39b39d19b40b4138f4411f
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      # The pinned review job requests actions: read to see the PR's CI; a
      # caller's block caps the called job, so it must be granted here too.
      actions: read
    with:
      # dependabot is listed so its PRs get reviewed automatically.
      # Without it claude-code-action hard-fails with "Workflow initiated
      # by non-human actor", and since branch protection requires an
      # approving review, dependabot PRs then sit unmergeable until a
      # maintainer triggers a review by hand.
      allowed-bots: "mctl-claude-remote,github-actions,dependabot,mctl-agents"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
